services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_workspace_postgres
    restart: always
    environment:
      POSTGRES_DB: ai_workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: ai_workspace_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pgvector_data:
